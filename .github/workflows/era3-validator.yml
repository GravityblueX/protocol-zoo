name: Era 3 validator

on:
  pull_request:
    paths:
      - ".github/workflows/era3-validator.yml"
      - "captures/era3-*/evidence.json"
      - "data/era3/**"
      - "schemas/era3/evidence.schema.json"
      - "scripts/**"
      - "tests/**"
  push:
    paths:
      - ".github/workflows/era3-validator.yml"
      - "captures/era3-*/evidence.json"
      - "data/era3/**"
      - "schemas/era3/evidence.schema.json"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.23,<5"
      - name: Exercise fail-closed regressions
        run: sh tests/era3-validator-regression.sh
      - name: Validate Era 3 JSON corpus
        shell: python
        run: |
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          evidence_files = [
              Path("captures/era3-dns/evidence.json"),
              Path("captures/era3-http/evidence.json"),
              Path("captures/era3-tls/evidence.json"),
              Path("captures/era3-tunnels/evidence.json"),
              Path("captures/era3-proxy/evidence.json"),
              Path("captures/era3-pmtud/evidence.json"),
              Path("captures/era3-traceroute/evidence.json"),
          ]
          schema = json.loads(
              Path("schemas/era3/evidence.schema.json").read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          for path in evidence_files:
              validator.validate(json.loads(path.read_text(encoding="utf-8")))

          data_files = sorted(Path("data/era3").glob("*.json"))
          if not data_files:
              raise SystemExit("no Era 3 data JSON found")
          for path in data_files:
              json.loads(path.read_text(encoding="utf-8"))

          print(
              f"validated {len(evidence_files)} evidence descriptors and "
              f"{len(data_files)} Era 3 data files"
          )
